# fdroiddata deposundaki metadata/com.plyg.droidserver.yml taslağı (bkz. docs/fdroid/README.md).
# <...> ile işaretli alanlar gönderimden önce doldurulmalı.
Categories:
  - Development
  - Internet
License: GPL-3.0-or-later
AuthorName: Kasim
SourceCode: https://github.com/kasimtmc/droidserver
IssueTracker: https://github.com/kasimtmc/droidserver/issues
Changelog: https://github.com/kasimtmc/droidserver/releases

AutoName: DroidServer

RepoType: git
Repo: https://github.com/kasimtmc/droidserver.git
# Tekrarlanabilir derleme: F-Droid'in derlediği APK, GitHub'daki imzalı APK ile karşılaştırılır.
Binaries: https://github.com/kasimtmc/droidserver/releases/download/v%v/droidserver-%v.apk

# 0.9.0 ve 0.9.1 eski kimlikle (dev.droidserver.app) çıktı; ilk gönderim com.plyg.droidserver ile çıkan ilk sürümdür.
Builds:
  - versionName: <ilk com.plyg.droidserver sürümü, örn. 0.9.2>
    versionCode: <sürüm kodu, örn. 90299>
    commit: v<aynı sürüm>
    subdir: app
    # Yerel YZ: llama.cpp alt modülü NDK ile kaynaktan derlenir (hazır ikili yok).
    submodules: true
    ndk: 29.0.14206865
    gradle:
      - yes
    gradleprops:
      - appVersion=<aynı sürüm>

AllowedAPKSigningKeys: <imza sertifikasının SHA-256'sı, küçük harf, iki nokta olmadan>

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
CurrentVersion: <aynı sürüm>
CurrentVersionCode: <aynı sürüm kodu>
